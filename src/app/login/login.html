<mat-card>
  <mat-card-header>
    <mat-card-title>{{ isRegisterMode ? 'Register' : 'Login' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="login()" autocomplete="off">
      <mat-error *ngIf="!loginvalid">
        {{ errorMessage }}
      </mat-error>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          formControlName="email"
          placeholder="sample@example.com"
          autocomplete="off"
          required
        />

        <mat-icon matSuffix>email</mat-icon>
        <mat-error *ngIf="emailControl.invalid && emailControl.touched">
          Enter a valid email address
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>

        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          placeholder="Password"
          autocomplete="new-password"
          required
        />

        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
          (click)="hidePassword = !hidePassword"
        >
          <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error *ngIf="passwordControl.invalid && passwordControl.touched">
          {{ isRegisterMode ? 'Password must be at least 6 characters' : 'Password is required' }}
        </mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="loginForm.invalid || isSubmitting"
      >
        {{
          isSubmitting
            ? isRegisterMode
              ? 'Registering...'
              : 'Logging in...'
            : isRegisterMode
              ? 'Register'
              : 'Login'
        }}
      </button>

      <button mat-button type="button" (click)="toggleMode()" [disabled]="isSubmitting">
        {{ isRegisterMode ? 'Back to login' : 'Create an account' }}
      </button>
    </form>
  </mat-card-content>
</mat-card>
